name: pre-commit

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Install fortitude
        run: pip install fortitude-lint
      - name: Run fortitude lint on Fortran files
        run: |
          fortitude lib/**/*.[fF]90 lib/**/*.[fF] lib/**/*.[fF]77 lib/**/*.[fF]OR
